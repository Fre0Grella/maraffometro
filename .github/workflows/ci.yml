name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      # npm 11.5 crashes resolving vitest's peers; the repo pins a version that doesn't.
      - run: npm install -g npm@11.19.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Runs once scripts/setup-cloudflare.sh has created the Cloudflare resources,
  # stored the secrets and set the DEPLOY_ENABLED repository variable.
  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@11.19.1
      - run: npm ci

      - name: Apply D1 migrations
        working-directory: backend
        run: npx wrangler d1 migrations apply maraffometro-db --remote

      # Before the Pages project: its service binding points at this Worker.
      - name: Deploy Worker
        working-directory: backend
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          npx wrangler deploy --minify
          node -e '
            const { GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, JWT_SECRET } = process.env;
            require("fs").writeFileSync("/tmp/secrets.json", JSON.stringify({ GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, JWT_SECRET }));
          '
          npx wrangler secret bulk /tmp/secrets.json
          rm /tmp/secrets.json

      - name: Build frontend
        run: npm run build

      - name: Deploy Pages
        working-directory: frontend
        run: npx wrangler pages deploy dist --project-name maraffometro --branch main
